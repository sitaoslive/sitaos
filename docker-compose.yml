version: '3.8'

services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphavision_controlplane
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SALES_OS_ENV=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
