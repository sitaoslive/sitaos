# Alpha Vision SaaS Control Plane - Nginx Reverse Proxy Configuration
server {
    listen 80;
    server_name admin.alphavisionm.com api.alphavisionm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.alphavisionm.com api.alphavisionm.com;

    ssl_certificate /etc/letsencrypt/live/admin.alphavisionm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.alphavisionm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /var/www/alphavision/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;
        access_log off;
    }
}
